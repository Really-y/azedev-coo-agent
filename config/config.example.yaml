# ~/.hermes/config.yaml — the sections changed for the COO agent (not the full file).
# Every other key keeps Hermes Agent's default. Secrets live only in ~/.hermes/.env
# and are referenced here as ${env:NAME}.

model:
  default: "<model-name>"
  provider: "<provider>"

plugins:
  # Holographic memory provider. Search by meaning goes to the local LocRet-small service
  # (memory/locret-embed); no data leaves the server.
  hermes-memory-store:
    scope: profile
    recall_indicator: false
    embeddings: on
    embedding_url: http://127.0.0.1:8765/v1
    embedding_model: LocalDoc/LocRet-small
    embedding_space: locret-small-query-sym

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: holographic
  memory_char_limit: 3000   # MEMORY.md is for standing rules only; facts live in holographic
  user_char_limit: 2000

# WhatsApp sessions get no terminal or messaging: an employee message must not be able to trigger
# a send to an arbitrary target or run commands. Requests to the CEO go through a file queue
# (scripts/ceo_queue_forward.py).
platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  whatsapp: [clarify, connections, file, memory, session_search, skills, todo, vision]

mcp_servers:
  kanba-cloud:                      # task system (Bordaz / Kanba MCP)
    url: https://<task-system>/api/mcp
    headers:
      Authorization: "Bearer ${env:KANBA_MCP_TOKEN}"
    tools:
      exclude:                      # irreversible actions are never given to the agent
        - delete_task
        - delete_archived_task
        - purge_all_archived_tasks
        - delete_column
        - delete_daily_report
        - delete_subtask
        - add_project_member
        - archive_completed_tasks
